# XcodeGen 工程定义 —— 执行 `xcodegen generate` 会在本目录生成 XiangqiCoach.xcodeproj
#
# 工程文件本身不纳入版本管理（见 .gitignore），这样多人协作不会因为 pbxproj 冲突。
name: XiangqiCoach

options:
  bundleIdPrefix: com.peter260807
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: "1.0.0"
    DEVELOPMENT_LANGUAGE: zh-Hans
    # 设备构建（archive / ad hoc 打包）必须有团队 ID，否则 xcodebuild 会直接
    # 报 "requires a development team"。模拟器构建用不到它，留空也没关系。
    #
    # 与 WeiLian 项目保持同一套做法：团队 ID 不写进仓库，生成工程时传进来 ——
    #     TEAM_ID=<你的团队ID> xcodegen generate
    # 打包脚本 ios/scripts/make-adhoc-ipa.sh 会自动带上。
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "${TEAM_ID}"

targets:
  XiangqiCoach:
    type: application
    platform: iOS
    sources:
      - path: XiangqiCoach
    settings:
      base:
        PRODUCT_NAME: 象棋教练
        # 显示名可以是中文，但模块名必须是 ASCII —— 否则 `@testable import` 无法书写
        PRODUCT_MODULE_NAME: XiangqiCoach
        PRODUCT_BUNDLE_IDENTIFIER: com.peter260807.xiangqicoach
        # 1 = iPhone, 2 = iPad
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: 象棋教练
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # iPhone：竖屏为主，也允许横屏
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPad：四个方向都放开。原来固定横屏的理由是「棋盘横向展开、竖屏只能压小」，
        # 但竖屏下改成「棋盘全屏」单栏布局（棋盘铺满宽度、操作收进浮层）之后，
        # 竖屏反而比横屏更能看清棋盘 —— 见 PlayView.portraitLayout。
        # 附带好处：四个方向全覆盖后，归档时那条
        # 「All interface orientations must be supported unless the app requires full screen」
        # 警告也随之消失。
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 需要访问相册，用来读取棋盘照片并识别局面。
        INFOPLIST_KEY_NSCameraUsageDescription: 需要访问相机，用来拍摄棋盘并识别局面。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  XiangqiCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: XiangqiCoachTests
    dependencies:
      - target: XiangqiCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peter260807.xiangqicoach.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/象棋教练.app/象棋教练"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  XiangqiCoach:
    build:
      targets:
        XiangqiCoach: all
        XiangqiCoachTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - XiangqiCoachTests
