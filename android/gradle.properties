# ---------- JVM ----------
# ⚠️ 不要用 JDK 25 跑这份构建。
# AGP 8.7 / Kotlin 2.0 的支持上限是 JDK 21；而 Android Studio 自带的 JBR 是 25，
# 用它启动 Gradle 会直接崩在 `JavaVersion.parse("25.0.2")`，报错指不到真正的原因。
#
# 这里**不写死机器路径**（写了别人 clone 下来就编不动）。三种指定办法，任选其一：
#   1. 命令行/CI：JAVA_HOME=/path/to/jdk21 ./gradlew :app:assembleDebug
#   2. 显式覆盖：  ./gradlew :app:assembleDebug -Dorg.gradle.java.home=/path/to/jdk21
#   3. Android Studio：Settings → Build Tools → Gradle → Gradle JDK → 选 21
#
# 踩过的两个坑，写在这里免得重犯：
#   * 写进 `local.properties` 的 `org.gradle.java.home` **不生效**（Gradle 只读
#     命令行与 gradle.properties 里的这个属性）—— 实测过，仍然会用 JBR 25 启动然后崩。
#   * JBR 25 是 `java -version` 看着没问题、一构建才崩，别用版本号猜。

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ---------- Android ----------
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------- Kotlin ----------
kotlin.code.style=official
